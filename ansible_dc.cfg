[defaults]
host_key_checking=False
#ask_vault_pass=true
vault_password_file = /dev/shm/secret/vaultpass
callbacks_enabled = timer,profile_tasks
roles_path = /opt/deployment/pebbles-deploy/roles:/opt/deployment/pebbles-deploy/playbooks/k3s/roles

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o StrictHostKeyChecking=no
pipelining = True

[inventory]
#enable_plugins = host_list, script, auto, yaml, ini, toml
enable_plugins = yaml, openstack, ini
