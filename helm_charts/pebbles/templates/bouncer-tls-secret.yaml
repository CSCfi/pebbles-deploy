{{- if .Values.bouncerEnabled }}
{{- $domains := include "pebbles.bouncerDomains" . | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bouncer-tls-secret
data:
{{- range $domain, $cfg := $domains }}
{{- $cfg := $cfg | default dict }}
{{- $cert := required (printf "tlsCert for bouncer domain %s is missing" $domain) $cfg.tlsCert }}
{{- $key := required (printf "tlsKey for bouncer domain %s is missing" $domain) $cfg.tlsKey }}
{{- if $.Values.secretsEncodedByHelm }}
{{- $cert = $cert | b64enc }}
{{- $key = $key | b64enc }}
{{- end }}
  {{ $domain }}.crt: |{{ $cert | nindent 4 }}
  {{ $domain }}.key: |{{ $key | nindent 4 }}
{{- end }}
{{- end }}
