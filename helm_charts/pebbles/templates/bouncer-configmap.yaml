{{- if .Values.bouncerEnabled }}
{{- $domains := include "pebbles.bouncerDomains" . | fromJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bouncer-configmap
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="Refresh" content="1; URL=https://{{ .Values.bouncerToDomain }}">
        <title>Redirecting to {{ .Values.bouncerToDomain }}</title>
    </head>
    <body>
    Redirecting to
    <a href="https://{{ .Values.bouncerToDomain }}">{{ .Values.bouncerToDomain }}</a>
    </body>
    </html>

  # included by the image's nginx.conf via 'include /etc/nginx/conf.d/*.conf'.
  # the image's own default.conf keeps serving plain HTTP on 8080 (health probes).
  # one server block per domain, picked by SNI, each with its own certificate.
  bouncer_server_block.conf: |
{{- range $domain, $_ := $domains }}
    server {
        listen       8443 ssl;
        server_name  {{ $domain }};

        ssl_certificate      /etc/nginx/certs/{{ $domain }}.crt;
        ssl_certificate_key  /etc/nginx/certs/{{ $domain }}.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # bounce every path, not just /, to the redirect page.
        # '=200' overrides the 404 status, so monitoring/link checkers don't
        # see the bounce as an error.
        error_page 404 =200 /index.html;

        location / {
          root   /usr/share/nginx/html;
          index  index.html;
        }
    }
{{ end }}
{{- end }}
