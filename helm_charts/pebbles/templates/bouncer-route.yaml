{{- if .Values.bouncerEnabled }}
{{- $domains := include "pebbles.bouncerDomains" . | fromJson }}
{{- range $domain, $_ := $domains }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bouncer-{{ $domain | replace "." "-" }}
  {{- if $.Values.ipWhitelist }}
  annotations:
    haproxy.router.openshift.io/ip_whitelist: {{ $.Values.ipWhitelist }}
  {{- end }}
spec:
  host: {{ $domain }}
  to:
    kind: Service
    name: bouncer
    weight: 100
  port:
    targetPort: web-secure
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: passthrough
status:
  ingress: [ ]
{{- end }}
{{- end }}
